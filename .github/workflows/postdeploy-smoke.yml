name: Parfum Netlify post-deployment smoke
on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/postdeploy-smoke.yml"
      - "public_html/js/productos.js"
      - "public_html/combos.html"
      - "public_html/index.html"
      - "public_html/js/fallback-products.js"
      - "public_html/js/api.js"
      - "public_html/js/auth.js"
      - "public_html/js/layout.js"
      - "public_html/login.html"
      - "public_html/css/layout.css"
      - "public_html/contacto.html"
      - "public_html/detalle.html"
      - "public_html/privacidad.html"
      - "public_html/libro-reclamaciones.html"
      - "public_html/js/carrito.js"
      - "public_html/js/detalle.js"
      - "scripts/upgrade-decant-pages.cjs"
      - "tests/seo-canonical.test.cjs"
      - "public_html/css/app.css"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test canonical URL logic before deployment checks
        run: node tests/seo-canonical.test.cjs
      - name: Confirm live catalog, combos and session management are published
        run: |
          python3 - <<'PY'
          import time,urllib.request
          base="https://parfum-store-app.netlify.app/"
          paths={
              "combos.html":"Combos próximamente",
              "js/productos.js":"No se pudo consultar el catálogo real",
              "js/fallback-products.js":"window.PARFUM_FALLBACK_PRODUCTS = Object.freeze([])",
              "index.html":"Consultando perfumes disponibles…",
              "js/api.js":"parfum:session-expired",
              "js/auth.js":"rememberSession",
              "js/layout.js":"session-expired-dialog",
              "login.html":"Mantener sesión iniciada",
              "contacto.html":"Conversa directamente con nuestro equipo",
              "detalle.html":'id="reviewsMore"',
              "js/detalle.js":"REVIEWS_PREVIEW_COUNT = 4",
              "js/carrito.js":"payment-whatsapp-link",
              "privacidad.html":"contactar con nuestro equipo mediante",
              "libro-reclamaciones.html":"WhatsApp de atención",
              "css/app.css":".reviews-list.expanded{max-height:",
              "decants/asad/":'id="reviewsMore"',
              "decants/althair/":'id="reviewsMore"',
              "decants/khamrah/":'id="reviewsMore"',
              "decants/hawas-ice/":'id="reviewsMore"',
              "decants/dior-homme-intense/":'id="reviewsMore"',
              "decants/erba-pura/":'id="reviewsMore"',

          }
          for attempt in range(35):
              try:
                  for path, marker in paths.items():
                      req=urllib.request.Request(base+path,
                          headers={"User-Agent":"ParfumPostDeploy/2.0","Cache-Control":"no-cache"})
                      with urllib.request.urlopen(req,timeout=20) as r:
                          page=r.read().decode("utf-8",errors="replace")
                          assert r.status==200 and marker in page,(path,r.status)
                          if path=="index.html":
                              assert 'data-fallback="true"' not in page,"old hardcoded products"
                              assert '"telephone"' not in page,"visible phone still in structured data"
                          if path in ["contacto.html","privacidad.html","libro-reclamaciones.html"]:
                              assert "+51 963 257 194" not in page,"phone still printed in public copy"
                          if path=="js/carrito.js":
                              assert "Número Yape</dt>" not in page,"phone is still exposed in checkout"
                          if path in ("decants/asad/","decants/althair/","decants/khamrah/","decants/hawas-ice/","decants/erba-pura/"):
                              assert '"@type":"WebPage"' in page,"incomplete initial Product schema remains"
                              assert 'seo-product-intro' in page,"missing HTML fallback for Google"
                              assert '"@type":"Product"' not in page,"initial Product without real offers"

                  # SEO: comprobar que los productos distintos NO se entregan como una misma ficha.
                  import re
                  samples={
                      "erba-pura":"Decant Erba Pura",
                      "asad-bourbon":"Decant Asad Bourbon",
                      "stronger-with-you-intensely":"Decant Stronger With You Intensely",
                      "212-nyc":"Decant 212 NYC",
                      "le-beau-le-parfum":"Decant Le Beau Le Parfum",
                  }
                  for slug, expected_title in samples.items():
                      path=f"decants/{slug}/"
                      req=urllib.request.Request("https://parfum.com.pe/"+path,
                          headers={"User-Agent":"Googlebot","Cache-Control":"no-cache"})
                      with urllib.request.urlopen(req,timeout=20) as r:
                          html=r.read().decode("utf-8",errors="replace")
                          assert r.status==200,("product-status",slug,r.status)
                      expected_url=f"https://parfum.com.pe/{path}"
                      canonical=re.search(r'<link\s+rel="canonical"\s+href="([^"]+)"',html)
                      assert canonical and canonical.group(1)==expected_url,("product-canonical",slug,canonical.group(1) if canonical else None)
                      assert f"<title>{expected_title} | Parfum Perú</title>" in html,("product-title",slug)
                      assert "seo-product-intro" in html,("product-seo-intro",slug)
                      assert '"@type":"Product"' not in html,("incomplete-product-schema",slug)
                      print("SEO_CANONICAL_SELF_OK",slug,flush=True)
                  # Comprueba el sitemap desde la URL canónica y sin depender de Render.
                  import xml.etree.ElementTree as ET
                  sitemap="https://parfum.com.pe/sitemap.xml"
                  req=urllib.request.Request(sitemap,headers={"User-Agent":"Googlebot","Cache-Control":"no-cache"})
                  with urllib.request.urlopen(req,timeout=20) as r:
                      xml=r.read()
                      assert r.status==200,("sitemap",r.status)
                      assert r.url==sitemap,("sitemap redirected",r.url)
                  root=ET.fromstring(xml)
                  urls=root.findall("{http://www.sitemaps.org/schemas/sitemap/0.9}url")
                  assert len(urls)>=80,("few sitemap URLs",len(urls))
                  print("PARFUM_OFFICIAL_SITEMAP_HTTP_200",len(urls),flush=True)
                  print("PARFUM_PRODUCT_DETAIL_AND_REVIEWS_DEPLOYED_OK",flush=True)
                  break
              except Exception as exc:
                  print("WAIT",attempt+1,str(exc)[:160],flush=True)
                  time.sleep(10)
          else: raise SystemExit("New Parfum frontend was not verified at Netlify")
          PY
