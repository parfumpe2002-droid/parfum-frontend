name: Parfum Netlify post-deployment smoke
on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/postdeploy-smoke.yml"
      - "public_html/js/productos.js"
      - "public_html/combos.html"
      - "public_html/index.html"
      - "public_html/js/fallback-products.js"
      - "public_html/js/api.js"
      - "public_html/js/auth.js"
      - "public_html/js/layout.js"
      - "public_html/login.html"
      - "public_html/css/layout.css"
      - "public_html/contacto.html"
      - "public_html/detalle.html"
      - "public_html/privacidad.html"
      - "public_html/libro-reclamaciones.html"
      - "public_html/js/carrito.js"
      - "public_html/js/detalle.js"
      - "public_html/css/app.css"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Confirm live catalog, combos and session management are published
        run: |
          python3 - <<'PY'
          import time,urllib.request
          base="https://parfum-store-app.netlify.app/"
          paths={
              "combos.html":"Combos próximamente",
              "js/productos.js":"No se pudo consultar el catálogo real",
              "js/fallback-products.js":"window.PARFUM_FALLBACK_PRODUCTS = Object.freeze([])",
              "index.html":"Consultando perfumes disponibles…",
              "js/api.js":"parfum:session-expired",
              "js/auth.js":"rememberSession",
              "js/layout.js":"session-expired-dialog",
              "login.html":"Mantener sesión iniciada",
              "contacto.html":"Conversa directamente con nuestro equipo",
              "detalle.html":'id="reviewsMore"',
              "js/detalle.js":"REVIEWS_PREVIEW_COUNT = 4",
              "js/carrito.js":"payment-whatsapp-link",
              "privacidad.html":"contactar con nuestro equipo mediante",
              "libro-reclamaciones.html":"WhatsApp de atención",
              "css/app.css":".reviews-list.expanded{max-height:",
              "decants/hawas-ice/":'id="reviewsMore"',
              "decants/dior-homme-intense/":'id="reviewsMore"',
              "decants/erba-pura/":'id="reviewsMore"',

          }
          for attempt in range(35):
              try:
                  for path, marker in paths.items():
                      req=urllib.request.Request(base+path,
                          headers={"User-Agent":"ParfumPostDeploy/2.0","Cache-Control":"no-cache"})
                      with urllib.request.urlopen(req,timeout=20) as r:
                          page=r.read().decode("utf-8",errors="replace")
                          assert r.status==200 and marker in page,(path,r.status)
                          if path=="index.html":
                              assert 'data-fallback="true"' not in page,"old hardcoded products"
                              assert '"telephone"' not in page,"visible phone still in structured data"
                          if path in ["contacto.html","privacidad.html","libro-reclamaciones.html"]:
                              assert "+51 963 257 194" not in page,"phone still printed in public copy"
                          if path=="js/carrito.js":
                              assert "Número Yape</dt>" not in page,"phone is still exposed in checkout"
                  print("PARFUM_PRODUCT_DETAIL_AND_REVIEWS_DEPLOYED_OK",flush=True)
                  break
              except Exception as exc:
                  print("WAIT",attempt+1,str(exc)[:160],flush=True)
                  time.sleep(10)
          else: raise SystemExit("New Parfum frontend was not verified at Netlify")
          PY
