name: Parfum Netlify post-deployment smoke
on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/postdeploy-smoke.yml"
      - "public_html/js/productos.js"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify static catalog JavaScript is published
        run: |
          python3 - <<'PY'
          import time,urllib.request
          base="https://parfum-store-app.netlify.app/"
          marker="if (result.ok || catalogPollAttempt >="
          for attempt in range(35):
              try:
                  request=urllib.request.Request(base+"js/productos.js",
                      headers={"User-Agent":"ParfumPostDeploy/1.0","Cache-Control":"no-cache"})
                  with urllib.request.urlopen(request,timeout=20) as r:
                      data=r.read().decode("utf-8",errors="replace")
                      assert r.status==200 and marker in data
                  with urllib.request.urlopen(base+"productos.html",timeout=20) as r:
                      assert r.status==200
                  print("NETLIFY_DEPLOYED_PARFUM_OK",flush=True)
                  break
              except Exception as e:
                  print("WAIT",attempt+1,str(e)[:140],flush=True)
                  time.sleep(10)
          else:raise SystemExit("Parfum frontend new version not verified")
          PY
