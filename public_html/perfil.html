<body data-page="perfil"><div id="appHeader"></div><section class="page-hero"><div class="page-shell"><p class="eyebrow">Mi cuenta</p><h1>Perfil</h1><p>Actualiza tus datos para agilizar tus próximos pedidos.</p></div></section><main class="page-shell content-section"><div class="two-col"><form class="panel" id="profileForm"><h2>Datos personales</h2><div class="form-grid"><div class="field"><label>Nombre</label><input id="name" required=""/></div><div class="field"><label>Apellido</label><input id="lastName"/></div><div class="field full"><label>Correo</label><input disabled="" id="email"/></div><div class="field"><label>Teléfono</label><input id="phone"/></div><div class="field full"><label>Dirección</label><textarea id="address" rows="3"></textarea></div></div><button class="primary-btn" type="submit">Guardar cambios</button><p class="form-message" id="profileMessage"></p></form><form class="panel" id="passwordForm"><h2>Seguridad</h2><div class="field"><label>Contraseña actual</label><input id="currentPassword" required="" type="password"/></div><div class="field"><label>Nueva contraseña</label><input id="newPassword" minlength="6" required="" type="password"/></div><button class="secondary-btn" type="submit">Cambiar contraseña</button><p class="form-message" id="passwordMessage"></p></form></div></main><div id="appFooter"></div></body></html>
